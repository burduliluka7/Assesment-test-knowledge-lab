[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tkh-abstraction"
version = "0.1.0"
description = "Reproducible temporal native hypergraph abstraction assessment"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "scikit-learn==1.8.0", "PyYAML==6.0.3", "matplotlib==3.10.7", "sentence-transformers==5.1.0"]

[project.scripts]
tkh = "tkh_abstraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
